worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format pqc_log '$remote_addr - $remote_user [$time_local] "$request" '
                       'status=$status bytes=$body_bytes_sent '
                       'ssl_proto=$ssl_protocol ssl_cipher=$ssl_cipher '
                       'ssl_curves=$ssl_curves';

    access_log /var/log/nginx/access.log pqc_log;

    sendfile        on;
    keepalive_timeout 65;

    # 1. HTTP Management & Web Dashboard (:8080)
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy sang Secure Vault Backend API
        location /api/ {
            proxy_pass http://vault-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy sang PQC-CA Service API
        location /ca/ {
            proxy_pass http://pqc-ca:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. Post-Quantum HTTPS TLS 1.3 Gateway (:8443)
    server {
        listen 8443 ssl;
        server_name localhost;

        # Chứng chỉ PQC do ML-DSA-65 ký
        ssl_certificate     /etc/ssl/pqc/pqc_server.crt;
        ssl_certificate_key /etc/ssl/pqc/pqc_server.key;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768:MLKEM768:p384_mlkem768:X25519;

        location / {
            default_type application/json;
            return 200 '{\n  "status": "online",\n  "system": "Q-Shield Post-Quantum Gateway",\n  "tls_version": "$ssl_protocol",\n  "cipher_suite": "$ssl_cipher",\n  "client_ip": "$remote_addr",\n  "message": "Connected securely via Post-Quantum TLS 1.3 (ML-KEM / ML-DSA)"\n}\n';
        }

        location /ca/ {
            proxy_pass http://pqc-ca:8001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://vault-backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-TLS-Protocol $ssl_protocol;
            proxy_set_header X-TLS-Cipher $ssl_cipher;
        }
    }
}
